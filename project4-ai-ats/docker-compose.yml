services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ats, POSTGRES_PASSWORD: ats, POSTGRES_DB: ats }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment: { DATABASE_URL: "postgresql://ats:ats@db:5432/ats" }
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { pgdata: {} }
